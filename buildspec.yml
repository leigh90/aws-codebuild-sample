version: 0.2
phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - npm install
  pre_build:
    commands:
      - echo "Running pre-build steps e.g tests..."
      - npm test
  build:
    commands:
      - echo "Building the application..."
      - npm run build 
  post_build:
    commands:
      - echo "Running post-build steps..."
      - echo "Build completed on `date`"
artifacts:
  files:
    - '**/*'